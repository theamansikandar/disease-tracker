apiVersion: apps/v1
kind: Deployment
metadata:
  name: disease-tracker-v1
spec:
  replicas: 1
  selector:
    matchLabels: {app: disease-tracker, ver: v1}
  template:
    metadata:
      labels: {app: disease-tracker, ver: v1}
    spec:
      containers:
      - name: web
        image: DOCKERUSER/disease-tracker:v1
        ports: [{containerPort: 5000}]
---
apiVersion: v1
kind: Service
metadata:
  name: disease-tracker-v1-svc
spec:
  type: NodePort
  selector: {app: disease-tracker, ver: v1}
  ports:
  - port: 5000
    targetPort: 5000
    nodePort: 30001
